# Boehm test catalog
#
# Every tool Boehm supports is listed here with its run profiles.
# Each profile points to a static config template (checked into profiles/<tool>/)
# and declares which parameters can be overridden at runtime.
#
# The `output` field tells Boehm where to find the tool's results after execution.
#   - For JSON-based tools (Tulip): output path is embedded in the config JSON
#   - For script-based tools (k6, JMeter, Gatling): output is {{output_file}}
#   - For CLI-only tools (vegeta, wrk): output is {{output_file}} or stdout
#
# Consistency of measurement: the same template file is used every run,
# so test structure never drifts. Only the declared override params vary.
#
version: 1

tools:
  # ── Tulip ────────────────────────────────────────────────────────────
  tulip:
    description: "JVM micro-benchmarking tool by Anomaly"
    install: |
      git clone https://github.com/anomalyco/Tulip ~/git/Tulip
      cd ~/git/Tulip && ./gradlew build
    run:
      command: "cd ~/git/Tulip && ./gradlew -q :tulip-main:run --args='--config {{config_file}}'"
    profiles:
      http-get:
        description: >
          HTTP GET via TestHttpUser against a target base URL.
        config: profiles/tulip/http-get.jsonc
        output:
          path: "{{config.actions.output_filename}}"
          format: json
          schema: tulip-results
        overrides:
          target_url:
            path: "actions.user_params.url"
            default: "https://httpbin.org/get"
          rate_per_sec:
            path: "benchmarks.boehm-benchmark.aps_rate"
            default: 50
          duration_sec:
            path: "benchmarks.boehm-benchmark.benchmark_duration"
            default: 30
          warmup_sec:
            path: "benchmarks.boehm-benchmark.warmup_duration1"
            default: 5

      demo:
        description: "CPU-only via DemoUser (delay/noop actions, no HTTP)"
        config: profiles/tulip/demo.jsonc
        output:
          path: "{{config.actions.output_filename}}"
          format: json
          schema: tulip-results
        overrides:
          rate_per_sec:
            path: "benchmarks.boehm-demo.aps_rate"
            default: 1000
          duration_sec:
            path: "benchmarks.boehm-demo.benchmark_duration"
            default: 10

  # ── k6 ────────────────────────────────────────────────────────────────
  k6:
    description: "Load testing tool by Grafana (JavaScript)"
    install: "brew install k6"
    run:
      command: >
        k6 run
        -e TARGET_URL={{target_url}}
        -e RATE_PER_SEC={{rate_per_sec}}
        -e DURATION_SEC={{duration_sec}}
        --out json={{output_file}}
        {{config_file}}
    profiles:
      http-get:
        description: "HTTP GET with configurable rate and duration"
        config: profiles/k6/http-get.js
        output:
          path: "{{output_file}}"
          format: jsonl
          schema: k6-jsonl
        overrides:
          target_url:
            default: "https://httpbin.org/get"
          rate_per_sec:
            default: 50
          duration_sec:
            default: 30

  # ── JMeter ────────────────────────────────────────────────────────────
  jmeter:
    description: "Apache JMeter (Java, GUI + CLI)"
    install: "brew install jmeter"
    run:
      command: >
        jmeter
        -Jtarget_url={{target_url}}
        -Jthreads={{threads}}
        -Jduration_sec={{duration_sec}}
        -n -t {{config_file}}
        -l {{output_file}}
        -j {{output_file}}.log
    profiles:
      http-get:
        description: "HTTP GET via JMeter Thread Group"
        config: profiles/jmeter/http-get.jmx
        output:
          path: "{{output_file}}"
          format: csv
          schema: jmeter-csv
        overrides:
          target_url:
            default: "https://httpbin.org/get"
          threads:
            default: 10
          duration_sec:
            default: 30

  # ── Gatling ───────────────────────────────────────────────────────────
  gatling:
    description: "Scala-based load testing by Gatling Corp"
    install: "brew install gatling"
    run:
      command: >
        gatling run
        -Dtarget_url={{target_url}}
        -Drate_per_sec={{rate_per_sec}}
        -Dduration_sec={{duration_sec}}
        -s profiles.HttpGetSimulation
        -rf {{output_file}}.results
    profiles:
      http-get:
        description: "HTTP GET via Gatling simulation"
        config: profiles/gatling/http-get.scala
        output:
          path: "{{output_file}}.results/js/global_stats.json"
          format: json
          schema: gatling-stats
        overrides:
          target_url:
            default: "https://httpbin.org/get"
          rate_per_sec:
            default: 50
          duration_sec:
            default: 30

  # ── vegeta ────────────────────────────────────────────────────────────
  vegeta:
    description: "HTTP load testing by Uber (Go, single binary)"
    install: "brew install vegeta"
    run:
      command: >
        echo 'GET {{target_url}}'
        | vegeta attack
          -rate={{rate_per_sec}}
          -duration={{duration_sec}}s
          -output={{output_file}}.bin
        && vegeta report --type=json {{output_file}}.bin > {{output_file}}
    profiles:
      http-get:
        description: "HTTP GET at constant rate"
        output:
          path: "{{output_file}}"
          format: json
          schema: vegeta-report
        overrides:
          target_url:
            default: "https://httpbin.org/get"
          rate_per_sec:
            default: 50
          duration_sec:
            default: 30

  # ── wrk ───────────────────────────────────────────────────────────────
  wrk:
    description: "HTTP benchmarking tool (C, single binary)"
    install: "brew install wrk"
    run:
      command: >
        wrk
        -t{{threads}}
        -c{{connections}}
        -d{{duration_sec}}s
        --latency
        {{target_url}}
    profiles:
      http-get:
        description: "HTTP GET with fixed concurrency"
        output:
          path: "stdout"
          format: text
          schema: wrk-text
        overrides:
          target_url:
            default: "https://httpbin.org/get"
          threads:
            default: 4
          connections:
            default: 100
          duration_sec:
            default: 30
